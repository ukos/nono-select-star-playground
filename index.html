<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SELECT * — Every Quest Is a Query</title>
<meta name="description" content="ワードタイルを並べてSQLを組み立て、クエストを解くパズルゲーム。">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
<style>
  :root{
    --bg:#0b0e17; --panel:#131826; --panel2:#0e1220; --line:#2a3242;
    --ink:#ece6d6; --sub:#9aa7bd; --gold:#e8b030; --accent:#6aa0e0;
    --tile:#1d2740; --tileline:#3a4a6b; --good:#57c785; --bad:#e0685c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#05070c}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif; color:var(--ink)}
  .wrap{max-width:480px; margin:0 auto; min-height:100dvh; background:var(--bg);
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 0 0 1px #1a2132, 0 0 60px rgba(0,0,0,.8)}
  .screen{display:none}
  .screen.on{display:block}
  /* タイトル画面 */
  #scr-title{text-align:center; padding-top:12px}
  #scr-title img.logo{display:block; width:min(100%,360px); height:auto; margin:0 auto;
    border:3px solid #c0cadb; border-radius:18px; padding:6px; background:var(--panel2);
    box-shadow:0 0 0 3px #0c0e13, 0 0 24px rgba(160,180,210,.25)}
  .bigbtn{display:block; width:100%; margin:14px 0 0; padding:14px 16px; text-align:left;
    font-size:16px; font-weight:700; color:var(--ink); background:var(--panel);
    border:2px solid var(--line); border-radius:14px; cursor:pointer; white-space:nowrap; overflow:hidden}
  .bigbtn:active{border-color:var(--gold)}
  .bigbtn.primary{background:var(--gold); color:#0b0e17; border-color:var(--gold); text-align:center}
  .bigbtn:disabled{opacity:.45; cursor:default}
  .ver{margin-top:22px; font-size:11.5px; color:var(--sub)}
  /* クエスト選択 */
  h1.ttl{font-size:19px; margin:4px 0 2px; text-align:left}
  .themehead{display:flex; gap:10px; align-items:center; margin:10px 0 4px}
  .themehead img{width:54px; height:96px; object-fit:cover; border-radius:8px; border:2px solid var(--line)}
  .themehead .tn{font-size:16px; font-weight:700}
  .themehead .ts{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.5}
  .qbtn .st{float:right; font-size:12px; color:var(--gold)}
  .qbtn .st.lock{color:var(--sub)}
  .qbtn .st.clear{color:var(--good)}
  /* ゲーム画面 */
  #scr-game{margin:-16px -16px -24px; padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    background-size:cover; background-position:center top; background-attachment:scroll}
  .panel{background:rgba(10,13,24,.88); border:2px solid var(--line); border-radius:14px; padding:12px 14px; margin:12px 0}
  .qtitle{font-size:16px; font-weight:700; margin:0}
  .qstage{font-size:11px; color:var(--gold); letter-spacing:.08em}
  .client{font-size:13.5px; line-height:1.7; margin:6px 0 0}
  .tblwrap{overflow-x:auto; margin-top:8px}
  table.data{border-collapse:collapse; width:100%; font-size:12.5px}
  table.data th, table.data td{border:1px solid var(--tileline); padding:4px 8px; text-align:left; white-space:nowrap}
  table.data th{background:var(--tile); color:var(--accent); font-family:ui-monospace,Menlo,monospace; font-weight:700}
  table.data td{font-family:ui-monospace,Menlo,monospace}
  .secttl{font-size:12px; color:var(--sub); letter-spacing:.08em; margin:0 0 6px}
  #assembly{min-height:52px; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start}
  #assembly .empty{font-size:12.5px; color:var(--sub); padding:6px 2px}
  #sqlprev{font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:var(--accent);
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-top:8px;
    min-height:34px; word-break:break-all}
  #palette{display:flex; flex-wrap:wrap; gap:6px}
  .tile{display:inline-block; padding:8px 12px; border-radius:10px; background:var(--tile);
    border:2px solid var(--tileline); color:var(--ink); font-family:ui-monospace,Menlo,monospace;
    font-size:14px; font-weight:700; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:none}
  .tile.kw{color:#8fc1ff}
  .tile.val{color:#ffd97a}
  .tile.agg{color:#7ae2c3}
  .themehead{display:flex; gap:8px; align-items:center; margin:8px 0 2px}
  .themehead img{width:40px; height:54px; object-fit:cover; border-radius:8px; border:1px solid var(--line)}
  .themehead h3{font-size:15px; text-align:left; margin:0; line-height:1.35}
  .themehead p{font-size:12px; color:var(--sub); text-align:left; margin:2px 0 0; line-height:1.45}
  .qbtn{margin-top:8px}
  .themehead.tap{cursor:pointer}
  .themehead .chev{margin-left:auto; font-size:18px; color:var(--sub); padding:0 6px}
  .themehead .prog{color:var(--accent, #ffd34d); font-weight:700}
  .tile.op{color:#f2a0c0}
  .tile.inasm{border-color:var(--gold)}
  .dragghost{position:fixed; z-index:99; pointer-events:none; opacity:.92; transform:translate(-50%,-50%)}
  .row2{display:flex; gap:10px}
  .row2 .bigbtn{margin-top:12px}
  #result{display:none}
  #result.show{display:block}
  #result .msg{font-size:14px; line-height:1.7}
  #result.good{border-color:var(--good)}
  #result.bad{border-color:var(--bad)}
  .backlink{display:inline-block; margin-top:14px; font-size:13px; color:var(--accent); background:none; border:none; cursor:pointer; padding:4px 0}
</style>
</head>
<body>
<div class="wrap">

  <!-- タイトル画面 -->
  <section id="scr-title" class="screen on">
    <img class="logo" src="assets/logo.jpg" alt="SELECT * — Every Quest Is a Query ロゴ">
    <button class="bigbtn primary" id="btn-start">▶ はじめる</button>
    <p class="ver">SELECT * ver. 0.6.2<br>ワードタイルを並べてSQLを組み立てるパズル</p>
    <button class="backlink sndbtn" type="button">🔊 音：オン</button>
  </section>

  <!-- クエスト選択画面 -->
  <section id="scr-select" class="screen">
    <h1 class="ttl">クエスト選択</h1>
    <div id="qlist"></div>
    <button class="backlink" id="btn-to-title">← タイトルへもどる</button>
  </section>

  <!-- ゲーム画面 -->
  <section id="scr-game" class="screen">
    <div class="panel">
      <div class="qstage" id="g-stage"></div>
      <p class="qtitle" id="g-title"></p>
      <p class="client" id="g-client"></p>
      <div id="g-tables"></div>
    </div>

    <div class="panel">
      <p class="secttl">組み立て欄（タイルをタップ or ドラッグ）</p>
      <div id="assembly"></div>
      <div id="sqlprev"></div>
      <div class="row2">
        <button class="bigbtn primary" id="btn-run">実行する</button>
        <button class="bigbtn" id="btn-clear">やり直す</button>
      </div>
    </div>

    <div class="panel">
      <p class="secttl">タイル置き場</p>
      <div id="palette"></div>
    </div>

    <div class="panel" id="result">
      <p class="msg" id="result-msg"></p>
      <div class="tblwrap"><table class="data" id="result-table"></table></div>
      <button class="bigbtn primary" id="btn-next" style="display:none">次のクエストへ ▶</button>
    </div>

    <button class="backlink" id="btn-to-select">← クエスト選択へもどる</button>
    <button class="backlink sndbtn" type="button">🔊 音：オン</button>
  </section>

</div>
<script>
// === CORE START ===
const KEYWORDS = new Set(["SELECT","FROM","WHERE","ORDER BY","LIMIT","AND","OR","ASC","DESC","GROUP BY","HAVING","JOIN","ON","PIVOT","FOR"]);
const OPERATORS = new Set(["=","!=","<",">","<=",">=","LIKE"]);
const AGG_RE = /^(COUNT|SUM|AVG|MIN|MAX)\((\*|[A-Za-z_][A-Za-z0-9_.]*)\)$/;

function tokenKind(tok){
  if (KEYWORDS.has(tok)) return "kw";
  if (OPERATORS.has(tok)) return "op";
  if (tok === "*") return "star";
  if (tok === "(" || tok === ")") return "paren";
  if (AGG_RE.test(tok)) return "agg";
  if (/^'.*'$/.test(tok)) return "str";
  if (/^-?\d+(\.\d+)?$/.test(tok)) return "num";
  return "ident";
}
function tokenValue(tok){
  const k = tokenKind(tok);
  if (k === "str") return tok.slice(1, -1);
  if (k === "num") return Number(tok);
  return tok;
}

function parseQuery(tokens){
  let i = 0;
  const peek = () => tokens[i];
  const next = () => tokens[i++];
  if (next() !== "SELECT") throw new Error("SELECT から始めてください");
  const cols = [];
  let pivotSpec = null;
  if (peek() === "*"){ next(); cols.push("*"); }
  else {
    while (i < tokens.length){
      if (peek() === "PIVOT"){
        next();
        const aggTok = next();
        if (!aggTok || tokenKind(aggTok) !== "agg") throw new Error("PIVOT のあとに集計（SUM や COUNT(*) など）を1つ置きます");
        if (next() !== "FOR") throw new Error("PIVOT の集計のあとに FOR が必要です");
        const forCol = next();
        if (!forCol || tokenKind(forCol) !== "ident") throw new Error("FOR のあとに、列にしたい列名が必要です");
        if (cols.length > 1 || (cols.length === 1 && tokenKind(cols[0]) !== "ident")) throw new Error("PIVOT の前に置けるのは、行の列1つまでです");
        pivotSpec = { agg: aggTok, forCol: forCol, rowKey: cols.length ? cols[0] : null };
        break;
      }
      if (tokenKind(peek()) === "ident" || tokenKind(peek()) === "agg"){ cols.push(next()); continue; }
      break;
    }
  }
  if (!cols.length && !pivotSpec) throw new Error("SELECT のあとに列を選んでください");
  if (next() !== "FROM") throw new Error("列のあとに FROM が必要です");
  const table = next();
  if (!table || tokenKind(table) !== "ident") throw new Error("FROM のあとにテーブル名が必要です");
  const q = { cols: cols, table: table, join: null, where: [], whereAst: null, having: null, pivot: pivotSpec, groupBy: [], orderBy: null, limit: null };
  if (peek() === "JOIN"){
    next();
    const t2 = next();
    if (!t2 || tokenKind(t2) !== "ident") throw new Error("JOIN のあとにテーブル名が必要です");
    if (next() !== "ON") throw new Error("JOIN には ON が必要です");
    const c1 = next();
    if (!c1 || tokenKind(c1) !== "ident") throw new Error("ON の条件は「テーブル.列 = テーブル.列」の形で並べてください");
    if (next() !== "=") throw new Error("ON の条件には = が必要です");
    const c2 = next();
    if (!c2 || tokenKind(c2) !== "ident") throw new Error("ON の条件は「テーブル.列 = テーブル.列」の形で並べてください");
    q.join = { table: t2, left: c1, right: c2 };
  }
  if (peek() === "WHERE"){
    next();
    const parseCond = () => {
      const col = next();
      if (!col || tokenKind(col) !== "ident") throw new Error("WHERE の条件は「列 演算子 値」の形で並べてください");
      const op = next();
      if (!op || tokenKind(op) !== "op") throw new Error("条件には演算子（= や >=、LIKE など）が必要です");
      let val;
      if (peek() === "("){
        next();
        if (next() !== "SELECT") throw new Error("（ のあとは SELECT から副問い合わせを書きます");
        const aggTok = next();
        if (!aggTok || tokenKind(aggTok) !== "agg") throw new Error("副問い合わせでは集計（AVG や MAX など）を1つ使います");
        if (next() !== "FROM") throw new Error("副問い合わせにも FROM が必要です");
        const st = next();
        if (!st || tokenKind(st) !== "ident") throw new Error("副問い合わせのテーブル名が必要です");
        if (next() !== ")") throw new Error("副問い合わせは ） で閉じます");
        val = { subquery: { agg: aggTok, table: st } };
      } else {
        const valTok = next();
        const vk = valTok && tokenKind(valTok);
        if (!valTok || (vk !== "str" && vk !== "num")) throw new Error("条件には値が必要です");
        val = tokenValue(valTok);
      }
      return { kind: "cond", col: col, op: op, val: val };
    };
    const parseFactor = () => {
      if (peek() === "("){
        next();
        const e = parseOr();
        if (next() !== ")") throw new Error("条件のカッコは ） で閉じます");
        return e;
      }
      return parseCond();
    };
    const parseAnd = () => {
      let l = parseFactor();
      while (peek() === "AND"){ next(); l = { kind: "and", l: l, r: parseFactor() }; }
      return l;
    };
    const parseOr = () => {
      let l = parseAnd();
      while (peek() === "OR"){ next(); l = { kind: "or", l: l, r: parseAnd() }; }
      return l;
    };
    q.whereAst = parseOr();
    q.where = [];
    (function collect(n){ if (!n) return; if (n.kind === "cond") q.where.push(n); else { collect(n.l); collect(n.r); } })(q.whereAst);
  }
  if (peek() === "GROUP BY"){
    next();
    const col = next();
    if (!col || tokenKind(col) !== "ident") throw new Error("GROUP BY のあとに列が必要です");
    q.groupBy.push(col);
  }
  if (peek() === "HAVING"){
    next();
    const left = next();
    if (!left || (tokenKind(left) !== "agg" && tokenKind(left) !== "ident")) throw new Error("HAVING の条件は「集計 演算子 値」の形で並べてください");
    const hop = next();
    if (!hop || tokenKind(hop) !== "op") throw new Error("HAVING の条件には演算子が必要です");
    const hvalTok = next();
    const hvk = hvalTok && tokenKind(hvalTok);
    if (!hvalTok || (hvk !== "str" && hvk !== "num")) throw new Error("HAVING の条件には値が必要です");
    q.having = { left: left, op: hop, val: tokenValue(hvalTok) };
  }
  if (peek() === "ORDER BY"){
    next();
    const col = next();
    if (!col || tokenKind(col) !== "ident") throw new Error("ORDER BY のあとに列が必要です");
    let dir = "ASC";
    if (peek() === "ASC" || peek() === "DESC") dir = next();
    q.orderBy = { col: col, dir: dir };
  }
  if (peek() === "LIMIT"){
    next();
    const n = next();
    if (!n || tokenKind(n) !== "num") throw new Error("LIMIT のあとに数が必要です");
    q.limit = Number(n);
  }
  if (i !== tokens.length) throw new Error("タイルの並びがSQLになっていません");
  return q;
}

function compareVals(a, op, b){
  switch (op){
    case "=": return a === b;
    case "!=": return a !== b;
    case "<": return a < b;
    case ">": return a > b;
    case "<=": return a <= b;
    case ">=": return a >= b;
    case "LIKE": {
      const pat = String(b).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/%/g, ".*").replace(/_/g, ".");
      return new RegExp("^" + pat + "$").test(String(a));
    }
  }
  return false;
}

function questTables(quest){
  if (quest.tables) return quest.tables;
  const t = {};
  t[quest.table] = { columns: quest.columns, rows: quest.rows };
  return t;
}
function tableObjects(tdef, tname){
  return tdef.rows.map((r) => {
    const o = {};
    tdef.columns.forEach((c, idx) => { o[c] = r[idx]; o[tname + "." + c] = r[idx]; });
    return o;
  });
}
function computeAgg(aggTok, objs){
  const m = AGG_RE.exec(aggTok);
  const fn = m[1], arg = m[2];
  if (fn === "COUNT") return objs.length;
  const vals = objs.map((o) => o[arg]);
  if (fn === "SUM") return vals.reduce((a, b) => a + b, 0);
  if (fn === "AVG") return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  if (fn === "MIN") return vals.length ? Math.min.apply(null, vals) : null;
  if (fn === "MAX") return vals.length ? Math.max.apply(null, vals) : null;
  return null;
}

function runQuery(quest, tokens){
  const q = parseQuery(tokens);
  const tables = questTables(quest);
  if (!tables[q.table]) throw new Error("テーブル " + q.table + " はこのクエストにありません");
  const allCols = new Set();
  Object.keys(tables).forEach((tn) => { tables[tn].columns.forEach((c) => { allCols.add(c); allCols.add(tn + "." + c); }); });
  const checkCol = (c) => { if (!allCols.has(c)) throw new Error("列 " + c + " はありません"); };
  const checkAgg = (tok) => { const a = AGG_RE.exec(tok)[2]; if (a !== "*") checkCol(a); };
  q.cols.forEach((c) => { if (c === "*") return; if (tokenKind(c) === "agg") checkAgg(c); else checkCol(c); });
  q.where.forEach((w) => checkCol(w.col));
  q.groupBy.forEach(checkCol);
  if (q.having){ if (tokenKind(q.having.left) === "agg") checkAgg(q.having.left); else checkCol(q.having.left); }
  if (q.pivot){ checkAgg(q.pivot.agg); checkCol(q.pivot.forCol); if (q.pivot.rowKey) checkCol(q.pivot.rowKey); }
  if (q.orderBy) checkCol(q.orderBy.col);
  if (q.join){
    if (!tables[q.join.table]) throw new Error("テーブル " + q.join.table + " はこのクエストにありません");
    checkCol(q.join.left); checkCol(q.join.right);
  }
  let objs = tableObjects(tables[q.table], q.table);
  if (q.join){
    const right = tableObjects(tables[q.join.table], q.join.table);
    const merged = [];
    objs.forEach((a) => { right.forEach((b) => {
      const o = Object.assign({}, a, b);
      if (o[q.join.left] === o[q.join.right]) merged.push(o);
    }); });
    objs = merged;
  }
  q.where.forEach((w) => {
    if (w.val && typeof w.val === "object" && w.val.subquery){
      const sq = w.val.subquery;
      if (!tables[sq.table]) throw new Error("テーブル " + sq.table + " はこのクエストにありません");
      checkAgg(sq.agg);
      w.val = computeAgg(sq.agg, tableObjects(tables[sq.table], sq.table));
    }
  });
  if (q.whereAst){
    const evalNode = (n, o) => n.kind === "cond" ? compareVals(o[n.col], n.op, n.val) : n.kind === "and" ? (evalNode(n.l, o) && evalNode(n.r, o)) : (evalNode(n.l, o) || evalNode(n.r, o));
    objs = objs.filter((o) => evalNode(q.whereAst, o));
  }
  if (q.pivot){
    const pv = q.pivot;
    const colVals = [];
    objs.forEach((o) => { if (colVals.indexOf(o[pv.forCol]) < 0) colVals.push(o[pv.forCol]); });
    const rowVals = [];
    if (pv.rowKey) objs.forEach((o) => { if (rowVals.indexOf(o[pv.rowKey]) < 0) rowVals.push(o[pv.rowKey]); });
    const pvFn = AGG_RE.exec(pv.agg)[1];
    const outColsP = (pv.rowKey ? [pv.rowKey] : []).concat(colVals.map((v) => String(v)));
    let outP = (pv.rowKey ? rowVals : [null]).map((rv) => {
      const head = pv.rowKey ? [rv] : [];
      return head.concat(colVals.map((cv) => {
        const sub = objs.filter((o) => (pv.rowKey ? o[pv.rowKey] === rv : true) && o[pv.forCol] === cv);
        if (!sub.length) return (pvFn === "COUNT" || pvFn === "SUM") ? 0 : null;
        return computeAgg(pv.agg, sub);
      }));
    });
    if (q.orderBy){
      const ci = outColsP.indexOf(q.orderBy.col);
      if (ci >= 0){ const mul = q.orderBy.dir === "DESC" ? -1 : 1; outP = outP.slice().sort((a, b) => (a[ci] < b[ci] ? -1 : a[ci] > b[ci] ? 1 : 0) * mul); }
    }
    if (q.limit != null) outP = outP.slice(0, q.limit);
    return { columns: outColsP, rows: outP, ordered: !!q.orderBy };
  }
  const hasAgg = q.cols.some((c) => tokenKind(c) === "agg") || q.groupBy.length > 0 || !!q.having;
  let outCols, out;
  if (hasAgg){
    q.cols.forEach((c) => {
      if (tokenKind(c) !== "agg" && c !== "*" && q.groupBy.indexOf(c) < 0)
        throw new Error("集計と一緒に出せる列は GROUP BY の列だけです");
    });
    let groupList;
    if (q.groupBy.length){
      const gm = new Map();
      objs.forEach((o) => {
        const k = JSON.stringify(q.groupBy.map((c) => o[c]));
        if (!gm.has(k)) gm.set(k, []);
        gm.get(k).push(o);
      });
      groupList = Array.from(gm.values());
    } else {
      groupList = [objs];
    }
    outCols = q.cols.slice();
    out = groupList.map((g) => q.cols.map((c) => tokenKind(c) === "agg" ? computeAgg(c, g) : (g.length ? g[0][c] : null)));
    if (q.having){
      const hv = q.having;
      const keep = groupList.map((g) => {
        const lv = tokenKind(hv.left) === "agg" ? computeAgg(hv.left, g) : (g.length ? g[0][hv.left] : null);
        return compareVals(lv, hv.op, hv.val);
      });
      out = out.filter((_, idx) => keep[idx]);
    }
    if (q.orderBy){
      const ci = outCols.indexOf(q.orderBy.col);
      if (ci >= 0){
        const mul = q.orderBy.dir === "DESC" ? -1 : 1;
        out = out.slice().sort((a, b) => (a[ci] < b[ci] ? -1 : a[ci] > b[ci] ? 1 : 0) * mul);
      }
    }
  } else {
    if (q.orderBy){
      const col = q.orderBy.col, mul = q.orderBy.dir === "DESC" ? -1 : 1;
      objs = objs.slice().sort((a, b) => (a[col] < b[col] ? -1 : a[col] > b[col] ? 1 : 0) * mul);
    }
    outCols = q.cols[0] === "*" ? tables[q.table].columns.slice() : q.cols.slice();
    out = objs.map((o) => outCols.map((c) => o[c]));
  }
  if (q.limit != null) out = out.slice(0, q.limit);
  return { columns: outCols, rows: out, ordered: !!q.orderBy };
}

function judge(quest, playerTokens){
  let expected;
  try { expected = runQuery(quest, quest.solution); }
  catch (e) { return { ok: false, fatal: "作問エラー: " + e.message }; }
  let actual;
  try { actual = runQuery(quest, playerTokens); }
  catch (e) { return { ok: false, kind: "syntax", message: e.message }; }
  if (JSON.stringify(expected.columns) !== JSON.stringify(actual.columns)){
    return { ok: false, kind: "columns", message: "取る列が違います。依頼文の「何を見せるか」をもう一度見てください。", expected: expected, actual: actual };
  }
  if (expected.rows.length !== actual.rows.length){
    return { ok: false, kind: "rowcount", message: "件数が違います（正しくは " + expected.rows.length + " 件、いまは " + actual.rows.length + " 件）。条件を見直してください。", expected: expected, actual: actual };
  }
  const key = (r) => JSON.stringify(r);
  if (expected.rows.every((r, i) => key(r) === key(actual.rows[i]))) return { ok: true, expected: expected, actual: actual };
  const ms = (arr) => arr.map(key).sort().join("\n");
  if (ms(expected.rows) === ms(actual.rows)){
    return { ok: false, kind: "order", message: "行の中身は合っていますが、並び順が違います。", expected: expected, actual: actual };
  }
  return { ok: false, kind: "rows", message: "行の中身が違います。条件の値や演算子を見直してください。", expected: expected, actual: actual };
}

<script>
(function(){
  "use strict";
  var SAVE_KEY = "select-star-progress-v1";
  var cleared = [];
  try { cleared = JSON.parse(localStorage.getItem(SAVE_KEY) || "[]"); } catch (e) { cleared = []; }
  function saveProgress(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(cleared)); } catch (e) {} }

  var screens = { title: document.getElementById("scr-title"), select: document.getElementById("scr-select"), game: document.getElementById("scr-game") };
  function show(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("on", k === name); });
    window.scrollTo(0, 0);
  }

  // クエスト選択
  var qlist = document.getElementById("qlist");
  function isUnlocked(i){ return i === 0 || cleared.indexOf(QUESTS[i - 1].id) >= 0; }
  var expandedTheme = "";
  function renderSelect(){
    qlist.innerHTML = "";
    THEMES.forEach(function(th){
      var total = 0, done = 0;
      QUESTS.forEach(function(q){ if (q.theme === th.id){ total++; if (cleared.indexOf(q.id) >= 0) done++; } });
      var open = expandedTheme === th.id;
      var head = document.createElement("div");
      head.className = "themehead" + (th.soon ? "" : " tap");
      head.innerHTML = '<img src="assets/bg-' + th.id + '.jpg" alt="">'
        + "<div><h3>" + th.name + "</h3><p>" + (th.soon ? "準備中" : th.desc)
        + (th.soon ? "" : '　<span class="prog">クリア ' + done + "／" + total + "</span>") + "</p></div>"
        + (th.soon ? "" : '<span class="chev">' + (open ? "▾" : "▸") + "</span>");
      if (!th.soon){
        head.addEventListener("click", function(){
          expandedTheme = open ? "" : th.id;
          renderSelect();
        });
      }
      qlist.appendChild(head);
      if (th.soon || !open) return;
      QUESTS.forEach(function(q, i){
        if (q.theme !== th.id) return;
        var b = document.createElement("button");
        b.className = "bigbtn qbtn";
        var st = "";
        if (cleared.indexOf(q.id) >= 0) st = '<span class="st clear">✓ クリア</span>';
        else if (!isUnlocked(i)) st = '<span class="st lock">未解放</span>';
        b.innerHTML = "Q" + (i + 1) + "　" + q.title + st;
        b.disabled = !isUnlocked(i);
        b.addEventListener("click", function(){ openQuest(i); });
        qlist.appendChild(b);
      });
    });
  }

  // ゲーム画面
  var cur = -1, palette = [], assembly = [], uidSeq = 0;
  var asmEl = document.getElementById("assembly"), palEl = document.getElementById("palette");
  var sqlEl = document.getElementById("sqlprev");
  var resultPanel = document.getElementById("result"), resultMsg = document.getElementById("result-msg");
  var resultTable = document.getElementById("result-table"), btnNext = document.getElementById("btn-next");

  function renderDataTable(el, columns, rows){
    var html = "<tr>" + columns.map(function(c){ return "<th>" + c + "</th>"; }).join("") + "</tr>";
    rows.forEach(function(r){ html += "<tr>" + r.map(function(v){ return "<td>" + v + "</td>"; }).join("") + "</tr>"; });
    el.innerHTML = html;
  }
  function tileClass(text){
    var k = tokenKind(text);
    if (k === "kw" || k === "paren") return "tile kw";
    if (k === "op") return "tile op";
    if (k === "agg") return "tile agg";
    if (k === "str" || k === "num") return "tile val";
    return "tile";
  }
  function displaySql(tokens){
    var parts = [], inSel = true;
    var isCol = function(t){ var k = tokenKind(t); return k === "ident" || k === "agg"; };
    tokens.forEach(function(t, idx){
      if (t === "FROM") inSel = false;
      if (inSel && idx > 1 && isCol(t) && (isCol(tokens[idx - 1]) || tokens[idx - 1] === "*")) parts.push(",");
      parts.push(t);
    });
    return parts.join(" ").replace(/ ,/g, ",");
  }
  function makeTileEl(inst, inAsm){
    var d = document.createElement("span");
    d.className = tileClass(inst.text) + (inAsm ? " inasm" : "");
    d.textContent = inst.text;
    d.dataset.uid = inst.uid;
    attachTileHandlers(d, inst, inAsm);
    return d;
  }
  function renderTiles(){
    asmEl.innerHTML = "";
    if (!assembly.length){
      var e = document.createElement("span");
      e.className = "empty"; e.textContent = "ここにタイルを並べてSQLを組み立てます";
      asmEl.appendChild(e);
    }
    assembly.forEach(function(inst){ asmEl.appendChild(makeTileEl(inst, true)); });
    palEl.innerHTML = "";
    palette.forEach(function(inst){ palEl.appendChild(makeTileEl(inst, false)); });
    var tokens = assembly.map(function(x){ return x.text; });
    sqlEl.textContent = tokens.length ? displaySql(tokens) : "（SQLプレビュー）";
  }
  // === 効果音（WebAudio合成、厚めの二重発振＋ローパス） ===
  var actx = null, soundOn = true;
  try { soundOn = localStorage.getItem("select-star-sound-v1") !== "off"; } catch (e) {}
  function ac(){
    if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, t0, dur, type, gain, slideTo){
    var c = ac(); if (!c) return;
    var o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = type; o2.type = type;
    o.frequency.setValueAtTime(freq, t0); o2.frequency.setValueAtTime(freq * 1.006, t0);
    if (slideTo){ o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur); o2.frequency.exponentialRampToValueAtTime(slideTo * 1.006, t0 + dur); }
    f.type = "lowpass"; f.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination);
    o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
  }
  function sfx(name){
    if (!soundOn) return;
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    if (name === "place"){ tone(660, t, 0.09, "square", 0.15); tone(330, t, 0.10, "triangle", 0.22); }
    else if (name === "remove"){ tone(320, t, 0.09, "square", 0.12); tone(196, t, 0.11, "triangle", 0.20); }
    else if (name === "run"){ tone(440, t, 0.16, "sawtooth", 0.09, 880); tone(220, t, 0.16, "triangle", 0.14, 440); }
    else if (name === "good"){ [523, 659, 784, 1047].forEach(function(fr, i){ tone(fr, t + i * 0.07, 0.24, "triangle", 0.20); tone(fr / 2, t + i * 0.07, 0.24, "sine", 0.15); }); }
    else if (name === "bad"){ tone(160, t, 0.25, "sawtooth", 0.15); tone(110, t, 0.28, "square", 0.11); }
  }
  function refreshSoundBtns(){
    document.querySelectorAll(".sndbtn").forEach(function(b){ b.textContent = soundOn ? "🔊 音：オン" : "🔇 音：オフ"; });
  }
  document.querySelectorAll(".sndbtn").forEach(function(b){
    b.addEventListener("click", function(){
      soundOn = !soundOn;
      try { localStorage.setItem("select-star-sound-v1", soundOn ? "on" : "off"); } catch (e) {}
      refreshSoundBtns();
      if (soundOn) sfx("place");
    });
  });
  refreshSoundBtns();

  function moveTile(inst, inAsm){
    if (inAsm){
      assembly = assembly.filter(function(x){ return x.uid !== inst.uid; });
      palette.push(inst);
    } else {
      palette = palette.filter(function(x){ return x.uid !== inst.uid; });
      assembly.push(inst);
    }
    renderTiles();
    sfx(inAsm ? "remove" : "place");
  }
  function attachTileHandlers(el, inst, inAsm){
    var startX = 0, startY = 0, dragging = false, ghost = null;
    el.addEventListener("pointerdown", function(ev){
      startX = ev.clientX; startY = ev.clientY; dragging = false;
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener("pointermove", function(ev){
      if (ev.buttons !== 1) return;
      if (!dragging && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 10){
        dragging = true;
        ghost = el.cloneNode(true);
        ghost.className += " dragghost";
        ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
        document.body.appendChild(ghost);
      }
      if (dragging && ghost){ ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; }
    });
    el.addEventListener("pointerup", function(ev){
      if (ghost){ ghost.remove(); ghost = null; }
      if (dragging){
        var rA = asmEl.getBoundingClientRect(), rP = palEl.getBoundingClientRect();
        var pad = 30;
        var overAsm = ev.clientX >= rA.left - pad && ev.clientX <= rA.right + pad && ev.clientY >= rA.top - pad && ev.clientY <= rA.bottom + pad;
        var overPal = ev.clientX >= rP.left - pad && ev.clientX <= rP.right + pad && ev.clientY >= rP.top - pad && ev.clientY <= rP.bottom + pad;
        if (!inAsm && overAsm) moveTile(inst, false);
        else if (inAsm && overPal) moveTile(inst, true);
      } else {
        moveTile(inst, inAsm);
      }
      dragging = false;
    });
    el.addEventListener("pointercancel", function(){ if (ghost){ ghost.remove(); ghost = null; } dragging = false; });
  }

  function openQuest(i){
    cur = i;
    var q = QUESTS[i];
    expandedTheme = q.theme;
    document.getElementById("g-stage").textContent = q.stageName;
    document.getElementById("g-title").textContent = "Q" + (i + 1) + "　" + q.title;
    document.getElementById("g-client").textContent = q.client;
    // テーブル表示：クエストの全テーブル（列名ヘッダ＋全行）
    var tables = questTables(q);
    var wrap = document.getElementById("g-tables");
    wrap.innerHTML = "";
    Object.keys(tables).forEach(function(tn){
      var td = tables[tn];
      var p = document.createElement("p");
      p.className = "secttl"; p.style.marginTop = "10px";
      p.textContent = "テーブル： " + tn;
      var w = document.createElement("div");
      w.className = "tblwrap";
      var t = document.createElement("table");
      t.className = "data";
      var html = "<tr>" + td.columns.map(function(c){ return "<th>" + c + "</th>"; }).join("") + "</tr>";
      td.rows.forEach(function(r){ html += "<tr>" + r.map(function(v){ return "<td>" + v + "</td>"; }).join("") + "</tr>"; });
      t.innerHTML = html;
      w.appendChild(t);
      wrap.appendChild(p); wrap.appendChild(w);
    });
    screens.game.style.backgroundImage = "url(assets/bg-" + q.theme + ".jpg)";
    palette = q.tiles.map(function(t){ return { uid: ++uidSeq, text: t }; });
    assembly = [];
    resultPanel.className = "panel"; resultPanel.classList.remove("show");
    btnNext.style.display = "none";
    renderTiles();
    show("game");
  }

  document.getElementById("btn-run").addEventListener("click", function(){
    sfx("run");
    var q = QUESTS[cur];
    var tokens = assembly.map(function(x){ return x.text; });
    var res = judge(q, tokens);
    resultPanel.classList.add("show");
    if (res.ok){
      sfx("good");
      resultPanel.classList.remove("bad"); resultPanel.classList.add("good");
      resultMsg.textContent = "クエスト達成！ 依頼どおりのデータが取れました。";
      if (res.actual) renderDataTable(resultTable, res.actual.columns, res.actual.rows);
      resultTable.parentElement.style.display = "";
      if (cleared.indexOf(q.id) < 0){ cleared.push(q.id); saveProgress(); }
      if (cur + 1 < QUESTS.length){ btnNext.style.display = ""; } else { btnNext.style.display = "none"; }
    } else {
      sfx("bad");
      resultPanel.classList.remove("good"); resultPanel.classList.add("bad");
      resultMsg.textContent = res.message;
      if (res.actual){ renderDataTable(resultTable, res.actual.columns, res.actual.rows); resultTable.parentElement.style.display = ""; }
      else { resultTable.parentElement.style.display = "none"; }
      btnNext.style.display = "none";
    }
  });
  document.getElementById("btn-clear").addEventListener("click", function(){
    sfx("remove");
    palette = palette.concat(assembly); assembly = []; renderTiles();
  });
  btnNext.addEventListener("click", function(){ if (cur + 1 < QUESTS.length) openQuest(cur + 1); });
  document.getElementById("btn-start").addEventListener("click", function(){ renderSelect(); show("select"); });
  document.getElementById("btn-to-title").addEventListener("click", function(){ show("title"); });
  document.getElementById("btn-to-select").addEventListener("click", function(){ renderSelect(); show("select"); });
})();
</script>
</body>
</html>

<script>
// === CORE START ===
const KEYWORDS = new Set(["SELECT","FROM","WHERE","ORDER BY","LIMIT","AND","OR","ASC","DESC","GROUP BY","JOIN","ON"]);
const OPERATORS = new Set(["=","!=","<",">","<=",">=","LIKE"]);
const AGG_RE = /^(COUNT|SUM|AVG|MIN|MAX)\((\*|[A-Za-z_][A-Za-z0-9_.]*)\)$/;

function tokenKind(tok){
  if (KEYWORDS.has(tok)) return "kw";
  if (OPERATORS.has(tok)) return "op";
  if (tok === "*") return "star";
  if (tok === "(" || tok === ")") return "paren";
  if (AGG_RE.test(tok)) return "agg";
  if (/^'.*'$/.test(tok)) return "str";
  if (/^-?\d+(\.\d+)?$/.test(tok)) return "num";
  return "ident";
}
function tokenValue(tok){
  const k = tokenKind(tok);
  if (k === "str") return tok.slice(1, -1);
  if (k === "num") return Number(tok);
  return tok;
}

function parseQuery(tokens){
  let i = 0;
  const peek = () => tokens[i];
  const next = () => tokens[i++];
  if (next() !== "SELECT") throw new Error("SELECT から始めてください");
  const cols = [];
  if (peek() === "*"){ next(); cols.push("*"); }
  else { while (i < tokens.length && (tokenKind(peek()) === "ident" || tokenKind(peek()) === "agg")){ cols.push(next()); } }
  if (!cols.length) throw new Error("SELECT のあとに列を選んでください");
  if (next() !== "FROM") throw new Error("列のあとに FROM が必要です");
  const table = next();
  if (!table || tokenKind(table) !== "ident") throw new Error("FROM のあとにテーブル名が必要です");
  const q = { cols: cols, table: table, join: null, where: [], groupBy: [], orderBy: null, limit: null };
  if (peek() === "JOIN"){
    next();
    const t2 = next();
    if (!t2 || tokenKind(t2) !== "ident") throw new Error("JOIN のあとにテーブル名が必要です");
    if (next() !== "ON") throw new Error("JOIN には ON が必要です");
    const c1 = next();
    if (!c1 || tokenKind(c1) !== "ident") throw new Error("ON の条件は「テーブル.列 = テーブル.列」の形で並べてください");
    if (next() !== "=") throw new Error("ON の条件には = が必要です");
    const c2 = next();
    if (!c2 || tokenKind(c2) !== "ident") throw new Error("ON の条件は「テーブル.列 = テーブル.列」の形で並べてください");
    q.join = { table: t2, left: c1, right: c2 };
  }
  if (peek() === "WHERE"){
    next();
    let joiner = null;
    for (;;){
      const col = next();
      if (!col || tokenKind(col) !== "ident") throw new Error("WHERE の条件は「列 演算子 値」の形で並べてください");
      const op = next();
      if (!op || tokenKind(op) !== "op") throw new Error("条件には演算子（= や >=、LIKE など）が必要です");
      let val;
      if (peek() === "("){
        next();
        if (next() !== "SELECT") throw new Error("（ のあとは SELECT から副問い合わせを書きます");
        const aggTok = next();
        if (!aggTok || tokenKind(aggTok) !== "agg") throw new Error("副問い合わせでは集計（AVG や MAX など）を1つ使います");
        if (next() !== "FROM") throw new Error("副問い合わせにも FROM が必要です");
        const st = next();
        if (!st || tokenKind(st) !== "ident") throw new Error("副問い合わせのテーブル名が必要です");
        if (next() !== ")") throw new Error("副問い合わせは ） で閉じます");
        val = { subquery: { agg: aggTok, table: st } };
      } else {
        const valTok = next();
        const vk = valTok && tokenKind(valTok);
        if (!valTok || (vk !== "str" && vk !== "num")) throw new Error("条件には値が必要です");
        val = tokenValue(valTok);
      }
      q.where.push({ col: col, op: op, val: val, join: joiner });
      if (peek() === "AND" || peek() === "OR"){ joiner = next(); continue; }
      break;
    }
  }
  if (peek() === "GROUP BY"){
    next();
    const col = next();
    if (!col || tokenKind(col) !== "ident") throw new Error("GROUP BY のあとに列が必要です");
    q.groupBy.push(col);
  }
  if (peek() === "ORDER BY"){
    next();
    const col = next();
    if (!col || tokenKind(col) !== "ident") throw new Error("ORDER BY のあとに列が必要です");
    let dir = "ASC";
    if (peek() === "ASC" || peek() === "DESC") dir = next();
    q.orderBy = { col: col, dir: dir };
  }
  if (peek() === "LIMIT"){
    next();
    const n = next();
    if (!n || tokenKind(n) !== "num") throw new Error("LIMIT のあとに数が必要です");
    q.limit = Number(n);
  }
  if (i !== tokens.length) throw new Error("タイルの並びがSQLになっていません");
  return q;
}

function compareVals(a, op, b){
  switch (op){
    case "=": return a === b;
    case "!=": return a !== b;
    case "<": return a < b;
    case ">": return a > b;
    case "<=": return a <= b;
    case ">=": return a >= b;
    case "LIKE": {
      const pat = String(b).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/%/g, ".*").replace(/_/g, ".");
      return new RegExp("^" + pat + "$").test(String(a));
    }
  }
  return false;
}

function questTables(quest){
  if (quest.tables) return quest.tables;
  const t = {};
  t[quest.table] = { columns: quest.columns, rows: quest.rows };
  return t;
}
function tableObjects(tdef, tname){
  return tdef.rows.map((r) => {
    const o = {};
    tdef.columns.forEach((c, idx) => { o[c] = r[idx]; o[tname + "." + c] = r[idx]; });
    return o;
  });
}
function computeAgg(aggTok, objs){
  const m = AGG_RE.exec(aggTok);
  const fn = m[1], arg = m[2];
  if (fn === "COUNT") return objs.length;
  const vals = objs.map((o) => o[arg]);
  if (fn === "SUM") return vals.reduce((a, b) => a + b, 0);
  if (fn === "AVG") return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  if (fn === "MIN") return vals.length ? Math.min.apply(null, vals) : null;
  if (fn === "MAX") return vals.length ? Math.max.apply(null, vals) : null;
  return null;
}

function runQuery(quest, tokens){
  const q = parseQuery(tokens);
  const tables = questTables(quest);
  if (!tables[q.table]) throw new Error("テーブル " + q.table + " はこのクエストにありません");
  const allCols = new Set();
  Object.keys(tables).forEach((tn) => { tables[tn].columns.forEach((c) => { allCols.add(c); allCols.add(tn + "." + c); }); });
  const checkCol = (c) => { if (!allCols.has(c)) throw new Error("列 " + c + " はありません"); };
  const checkAgg = (tok) => { const a = AGG_RE.exec(tok)[2]; if (a !== "*") checkCol(a); };
  q.cols.forEach((c) => { if (c === "*") return; if (tokenKind(c) === "agg") checkAgg(c); else checkCol(c); });
  q.where.forEach((w) => checkCol(w.col));
  q.groupBy.forEach(checkCol);
  if (q.orderBy) checkCol(q.orderBy.col);
  if (q.join){
    if (!tables[q.join.table]) throw new Error("テーブル " + q.join.table + " はこのクエストにありません");
    checkCol(q.join.left); checkCol(q.join.right);
  }
  let objs = tableObjects(tables[q.table], q.table);
  if (q.join){
    const right = tableObjects(tables[q.join.table], q.join.table);
    const merged = [];
    objs.forEach((a) => { right.forEach((b) => {
      const o = Object.assign({}, a, b);
      if (o[q.join.left] === o[q.join.right]) merged.push(o);
    }); });
    objs = merged;
  }
  q.where.forEach((w) => {
    if (w.val && typeof w.val === "object" && w.val.subquery){
      const sq = w.val.subquery;
      if (!tables[sq.table]) throw new Error("テーブル " + sq.table + " はこのクエストにありません");
      checkAgg(sq.agg);
      w.val = computeAgg(sq.agg, tableObjects(tables[sq.table], sq.table));
    }
  });
  if (q.where.length){
    objs = objs.filter((o) => {
      let acc = null;
      for (const w of q.where){
        const v = compareVals(o[w.col], w.op, w.val);
        if (acc === null) acc = v;
        else if (w.join === "AND") acc = acc && v;
        else acc = acc || v;
      }
      return acc;
    });
  }
  const hasAgg = q.cols.some((c) => tokenKind(c) === "agg") || q.groupBy.length > 0;
  let outCols, out;
  if (hasAgg){
    q.cols.forEach((c) => {
      if (tokenKind(c) !== "agg" && c !== "*" && q.groupBy.indexOf(c) < 0)
        throw new Error("集計と一緒に出せる列は GROUP BY の列だけです");
    });
    let groupList;
    if (q.groupBy.length){
      const gm = new Map();
      objs.forEach((o) => {
        const k = JSON.stringify(q.groupBy.map((c) => o[c]));
        if (!gm.has(k)) gm.set(k, []);
        gm.get(k).push(o);
      });
      groupList = Array.from(gm.values());
    } else {
      groupList = [objs];
    }
    outCols = q.cols.slice();
    out = groupList.map((g) => q.cols.map((c) => tokenKind(c) === "agg" ? computeAgg(c, g) : (g.length ? g[0][c] : null)));
    if (q.orderBy){
      const ci = outCols.indexOf(q.orderBy.col);
      if (ci >= 0){
        const mul = q.orderBy.dir === "DESC" ? -1 : 1;
        out = out.slice().sort((a, b) => (a[ci] < b[ci] ? -1 : a[ci] > b[ci] ? 1 : 0) * mul);
      }
    }
  } else {
    if (q.orderBy){
      const col = q.orderBy.col, mul = q.orderBy.dir === "DESC" ? -1 : 1;
      objs = objs.slice().sort((a, b) => (a[col] < b[col] ? -1 : a[col] > b[col] ? 1 : 0) * mul);
    }
    outCols = q.cols[0] === "*" ? tables[q.table].columns.slice() : q.cols.slice();
    out = objs.map((o) => outCols.map((c) => o[c]));
  }
  if (q.limit != null) out = out.slice(0, q.limit);
  return { columns: outCols, rows: out, ordered: !!q.orderBy };
}

function judge(quest, playerTokens){
  let expected;
  try { expected = runQuery(quest, quest.solution); }
  catch (e) { return { ok: false, fatal: "作問エラー: " + e.message }; }
  let actual;
  try { actual = runQuery(quest, playerTokens); }
  catch (e) { return { ok: false, kind: "syntax", message: e.message }; }
  if (JSON.stringify(expected.columns) !== JSON.stringify(actual.columns)){
    return { ok: false, kind: "columns", message: "取る列が違います。依頼文の「何を見せるか」をもう一度見てください。", expected: expected, actual: actual };
  }
  if (expected.rows.length !== actual.rows.length){
    return { ok: false, kind: "rowcount", message: "件数が違います（正しくは " + expected.rows.length + " 件、いまは " + actual.rows.length + " 件）。条件を見直してください。", expected: expected, actual: actual };
  }
  const key = (r) => JSON.stringify(r);
  if (expected.rows.every((r, i) => key(r) === key(actual.rows[i]))) return { ok: true, expected: expected, actual: actual };
  const ms = (arr) => arr.map(key).sort().join("\n");
  if (ms(expected.rows) === ms(actual.rows)){
    return { ok: false, kind: "order", message: "行の中身は合っていますが、並び順が違います。", expected: expected, actual: actual };
  }
  return { ok: false, kind: "rows", message: "行の中身が違います。条件の値や演算子を見直してください。", expected: expected, actual: actual };
}

const THEMES = [
  { id: "guild", name: "冒険者ギルドの受付", desc: "ギルドの名簿係として、冒険者のデータを引き出すクエスト。" },
  { id: "cargo", name: "宇宙貨物船の積荷管理", desc: "貨物船の積荷係として、積荷と寄港地のデータを引き出すクエスト。" },

const CARGO_ROWS = [

<script>
(function(){
  "use strict";
  var SAVE_KEY = "select-star-progress-v1";
  var cleared = [];
  try { cleared = JSON.parse(localStorage.getItem(SAVE_KEY) || "[]"); } catch (e) { cleared = []; }
  function saveProgress(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(cleared)); } catch (e) {} }

  var screens = { title: document.getElementById("scr-title"), select: document.getElementById("scr-select"), game: document.getElementById("scr-game") };
  function show(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle("on", k === name); });
    window.scrollTo(0, 0);
  }

  // クエスト選択
  var qlist = document.getElementById("qlist");
  function isUnlocked(i){ return i === 0 || cleared.indexOf(QUESTS[i - 1].id) >= 0; }
  function renderSelect(){
    qlist.innerHTML = "";
    THEMES.forEach(function(th){
      var head = document.createElement("div");
      head.className = "themehead";
      head.innerHTML = '<img src="assets/bg-' + th.id + '.jpg" alt="">'
        + "<div><h3>" + th.name + "</h3><p>" + (th.soon ? "準備中" : th.desc) + "</p></div>";
      qlist.appendChild(head);
      if (th.soon) return;
      QUESTS.forEach(function(q, i){
        if (q.theme !== th.id) return;
        var b = document.createElement("button");
        b.className = "bigbtn qbtn";
        var st = "";
        if (cleared.indexOf(q.id) >= 0) st = '<span class="st clear">✓ クリア</span>';
        else if (!isUnlocked(i)) st = '<span class="st lock">未解放</span>';
        b.innerHTML = "Q" + (i + 1) + "　" + q.title + st;
        b.disabled = !isUnlocked(i);
        b.addEventListener("click", function(){ openQuest(i); });
        qlist.appendChild(b);
      });
    });
  }

  // ゲーム画面
  var cur = -1, palette = [], assembly = [], uidSeq = 0;
  var asmEl = document.getElementById("assembly"), palEl = document.getElementById("palette");
  var sqlEl = document.getElementById("sqlprev");
  var resultPanel = document.getElementById("result"), resultMsg = document.getElementById("result-msg");
  var resultTable = document.getElementById("result-table"), btnNext = document.getElementById("btn-next");

  function renderDataTable(el, columns, rows){
    var html = "<tr>" + columns.map(function(c){ return "<th>" + c + "</th>"; }).join("") + "</tr>";
    rows.forEach(function(r){ html += "<tr>" + r.map(function(v){ return "<td>" + v + "</td>"; }).join("") + "</tr>"; });
    el.innerHTML = html;
  }
  function tileClass(text){
    var k = tokenKind(text);
    if (k === "kw" || k === "paren") return "tile kw";
    if (k === "op") return "tile op";
    if (k === "agg") return "tile agg";
    if (k === "str" || k === "num") return "tile val";
    return "tile";
  }
  function displaySql(tokens){
    var parts = [], inSel = true;
    var isCol = function(t){ var k = tokenKind(t); return k === "ident" || k === "agg"; };
    tokens.forEach(function(t, idx){
      if (t === "FROM") inSel = false;
      if (inSel && idx > 1 && isCol(t) && (isCol(tokens[idx - 1]) || tokens[idx - 1] === "*")) parts.push(",");
      parts.push(t);
    });
    return parts.join(" ").replace(/ ,/g, ",");
  }
  function makeTileEl(inst, inAsm){
    var d = document.createElement("span");
    d.className = tileClass(inst.text) + (inAsm ? " inasm" : "");
    d.textContent = inst.text;
    d.dataset.uid = inst.uid;
    attachTileHandlers(d, inst, inAsm);
    return d;
  }
  function renderTiles(){
    asmEl.innerHTML = "";
    if (!assembly.length){
      var e = document.createElement("span");
      e.className = "empty"; e.textContent = "ここにタイルを並べてSQLを組み立てます";
      asmEl.appendChild(e);
    }
    assembly.forEach(function(inst){ asmEl.appendChild(makeTileEl(inst, true)); });
    palEl.innerHTML = "";
    palette.forEach(function(inst){ palEl.appendChild(makeTileEl(inst, false)); });
    var tokens = assembly.map(function(x){ return x.text; });
    sqlEl.textContent = tokens.length ? displaySql(tokens) : "（SQLプレビュー）";
  }
  function moveTile(inst, inAsm){
    if (inAsm){
      assembly = assembly.filter(function(x){ return x.uid !== inst.uid; });
      palette.push(inst);
    } else {
      palette = palette.filter(function(x){ return x.uid !== inst.uid; });
      assembly.push(inst);
    }
    renderTiles();
  }
  function attachTileHandlers(el, inst, inAsm){
    var startX = 0, startY = 0, dragging = false, ghost = null;
    el.addEventListener("pointerdown", function(ev){
      startX = ev.clientX; startY = ev.clientY; dragging = false;
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener("pointermove", function(ev){
      if (ev.buttons !== 1) return;
      if (!dragging && Math.hypot(ev.clientX - startX, ev.clientY - startY) > 10){
        dragging = true;
        ghost = el.cloneNode(true);
        ghost.className += " dragghost";
        ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
        document.body.appendChild(ghost);
      }
      if (dragging && ghost){ ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; }
    });
    el.addEventListener("pointerup", function(ev){
      if (ghost){ ghost.remove(); ghost = null; }
      if (dragging){
        var rA = asmEl.getBoundingClientRect(), rP = palEl.getBoundingClientRect();
        var pad = 30;
        var overAsm = ev.clientX >= rA.left - pad && ev.clientX <= rA.right + pad && ev.clientY >= rA.top - pad && ev.clientY <= rA.bottom + pad;
        var overPal = ev.clientX >= rP.left - pad && ev.clientX <= rP.right + pad && ev.clientY >= rP.top - pad && ev.clientY <= rP.bottom + pad;
        if (!inAsm && overAsm) moveTile(inst, false);
        else if (inAsm && overPal) moveTile(inst, true);
      } else {
        moveTile(inst, inAsm);
      }
      dragging = false;
    });
    el.addEventListener("pointercancel", function(){ if (ghost){ ghost.remove(); ghost = null; } dragging = false; });
  }

  function openQuest(i){
    cur = i;
    var q = QUESTS[i];
    document.getElementById("g-stage").textContent = q.stageName;
    document.getElementById("g-title").textContent = "Q" + (i + 1) + "　" + q.title;
    document.getElementById("g-client").textContent = q.client;
    // テーブル表示：クエストの全テーブル（列名ヘッダ＋全行）
    var tables = questTables(q);
    var wrap = document.getElementById("g-tables");
    wrap.innerHTML = "";
    Object.keys(tables).forEach(function(tn){
      var td = tables[tn];
      var p = document.createElement("p");
      p.className = "secttl"; p.style.marginTop = "10px";
      p.textContent = "テーブル： " + tn;
      var w = document.createElement("div");
      w.className = "tblwrap";
      var t = document.createElement("table");
      t.className = "data";
      var html = "<tr>" + td.columns.map(function(c){ return "<th>" + c + "</th>"; }).join("") + "</tr>";
      td.rows.forEach(function(r){ html += "<tr>" + r.map(function(v){ return "<td>" + v + "</td>"; }).join("") + "</tr>"; });
      t.innerHTML = html;
      w.appendChild(t);
      wrap.appendChild(p); wrap.appendChild(w);
    });
    screens.game.style.backgroundImage = "url(assets/bg-" + q.theme + ".jpg)";
    palette = q.tiles.map(function(t){ return { uid: ++uidSeq, text: t }; });
    assembly = [];
    resultPanel.className = "panel"; resultPanel.classList.remove("show");
    btnNext.style.display = "none";
    renderTiles();
    show("game");
  }

  document.getElementById("btn-run").addEventListener("click", function(){
    var q = QUESTS[cur];
    var tokens = assembly.map(function(x){ return x.text; });
    var res = judge(q, tokens);
    resultPanel.classList.add("show");
    if (res.ok){
      resultPanel.classList.remove("bad"); resultPanel.classList.add("good");
      resultMsg.textContent = "クエスト達成！ 依頼どおりのデータが取れました。";
      if (res.actual) renderDataTable(resultTable, res.actual.columns, res.actual.rows);
      resultTable.parentElement.style.display = "";
      if (cleared.indexOf(q.id) < 0){ cleared.push(q.id); saveProgress(); }
      if (cur + 1 < QUESTS.length){ btnNext.style.display = ""; } else { btnNext.style.display = "none"; }
    } else {
      resultPanel.classList.remove("good"); resultPanel.classList.add("bad");
      resultMsg.textContent = res.message;
      if (res.actual){ renderDataTable(resultTable, res.actual.columns, res.actual.rows); resultTable.parentElement.style.display = ""; }
      else { resultTable.parentElement.style.display = "none"; }
      btnNext.style.display = "none";
    }
  });
  document.getElementById("btn-clear").addEventListener("click", function(){
    palette = palette.concat(assembly); assembly = []; renderTiles();
  });
  btnNext.addEventListener("click", function(){ if (cur + 1 < QUESTS.length) openQuest(cur + 1); });
  document.getElementById("btn-start").addEventListener("click", function(){ renderSelect(); show("select"); });
  document.getElementById("btn-to-title").addEventListener("click", function(){ show("title"); });
  document.getElementById("btn-to-select").addEventListener("click", function(){ renderSelect(); show("select"); });
})();
</script>
